id: iec-ara2
libelle: Patients sous IEC ou ARA2
source: document_source
statut_validation: a_valider
declencheur:
  type: medicament
  atc: [C09, C09C]          # A VALIDER : C09 inclut C09C ; associations ?
instauration:               # à l'instauration ou changement de posologie
  - prescrire: Ionogramme (Na, K)
    periodicite_texte: Dans 2 à 4 semaines puis 1 an
    jalons: [S2-4, M12]      # S = semaines après instauration ; la maquette prend la borne basse
  - prescrire: Créatinine
    periodicite_texte: Dans 2 à 4 semaines puis 1 an
    jalons: [S2-4, M12]
entretien:                  # après 1 an
  - chercher: Sodium
    prescrire: Ionogramme
    periodicite: {min: 1, max: 2, unite: an}
  - chercher: Créatinine
    prescrire: Clairance de la créatinine
    periodicite: {min: 1, max: 2, unite: an}
  - chercher: Microalbuminurie
    prescrire: null          # A VALIDER : gabarit non rempli dans le document (« Eléments à prescrire »)
    periodicite: {min: 1, max: 2, unite: an}
