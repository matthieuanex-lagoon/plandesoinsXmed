id: lamotrigine
libelle: Patient sous lamotrigine
source: document_source
statut_validation: a_valider
declencheur:
  type: medicament
  atc: [N03AX09]
instauration:               # à l'instauration
  - {prescrire: NFS, jalons: [T0, M12]}
  - {prescrire: Ionogramme, jalons: [T0, M12]}
  - {prescrire: Glycémie, jalons: [T0, M6, M12]}
  - {prescrire: EAL, jalons: [T0, M12]}
  - {prescrire: Bilan hépatique, jalons: [T0, M12]}
  - {prescrire: Créatinine / Clairance de la créatinine, jalons: [T0, M12]}
entretien:                  # après 1 an, fréquence tous les 12 mois
  - {chercher: Hémoglobine, prescrire: NFS, periodicite: {min: 12, unite: mois}}
  - {chercher: Sodium, prescrire: Ionogramme, periodicite: {min: 12, unite: mois}}
  - {chercher: Glycémie, prescrire: Glycémie, periodicite: {min: 12, unite: mois}}
  - {chercher: Chol LDL, prescrire: EAL, periodicite: {min: 12, unite: mois}}
  - {chercher: SGOT, prescrire: Bilan hépatique, periodicite: {min: 12, unite: mois}}
  - {chercher: Clairance de la créatinine, prescrire: Clairance de la créatinine, periodicite: {min: 12, unite: mois}}
